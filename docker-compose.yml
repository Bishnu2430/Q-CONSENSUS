services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    container_name: qconsensus-orchestrator
    env_file:
      - .env
    depends_on:
      llama:
        condition: service_healthy
      blockchain:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      # Optional Piper voice model (scripts/download_tts_voice.py); without this
      # mount TTS_ENABLED=true can never find the model inside the container.
      - ./models/tts:/app/models/tts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qconsensus-llama
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "0"
      - "-c"
      - "4096"
      - "--threads"
      - "4"
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  blockchain:
    build:
      context: ./blockchain
      dockerfile: geth.Dockerfile
    container_name: qconsensus-blockchain
    ports:
      - "8545:8545"
    volumes:
      - gethdata:/data
      - ./blockchain/init-geth.sh:/usr/local/bin/init-geth.sh
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget -q -O- --header='Content-Type: application/json'
          --post-data='{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
          http://127.0.0.1:8545 | grep -q result
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  gethdata:
