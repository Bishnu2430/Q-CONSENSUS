# Start with scripts\start.cmd: it checks prerequisites, shows download and
# deploy progress, and waits for every service to be healthy. Plain
# "docker compose up" works too.
#
# How the containers reach each other is defined here, not in .env: the values
# under "environment:" override anything .env sets. .env is optional and only
# holds settings (see .env.example).
name: qconsensus

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

x-chain-env: &chain-env
  CONTRACT_ANCHOR_ENABLED: ${CONTRACT_ANCHOR_ENABLED:-true}
  ETH_RPC_URL: http://blockchain:8545
  ETH_CHAIN_ID: "1337"
  # Well-known signer account of the local dev chain (blockchain/genesis.json);
  # it only ever holds test ether on this private chain.
  ETH_FROM_ADDRESS: "0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266"
  ETH_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  # The contract service saves the deployed address here. The plain variable
  # is blanked so a leftover value in an old .env can't point elsewhere.
  ANCHOR_CONTRACT_ADDRESS_FILE: /anchor/contract-address
  ANCHOR_CONTRACT_ADDRESS: ""

services:
  orchestrator:
    build: *app-build
    image: qconsensus-orchestrator
    container_name: qconsensus-orchestrator
    env_file:
      - path: .env
        required: false
    environment:
      <<: *chain-env
      LLM_BASE_URL: http://llama:8080
    depends_on:
      llama:
        condition: service_healthy
      contract:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - anchor:/anchor:ro
      # Only the optional Piper voice (models/tts/) is read from here; the
      # models service downloads it when TTS_ENABLED=true.
      - models:/app/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: deploys the anchor contract (same image as the orchestrator)
  # and saves its address in the anchor volume. A no-op while the chain still
  # has that contract; redeploys after a chain reset.
  contract:
    build: *app-build
    image: qconsensus-orchestrator
    command: ["python", "scripts/deploy_contract.py"]
    environment: *chain-env
    depends_on:
      blockchain:
        condition: service_healthy
    volumes:
      - anchor:/anchor

  # One-shot: downloads the GGUF model (and Piper voice) into the models
  # volume, then exits. A no-op when the files are already there.
  models:
    build:
      context: ./docker/models
    environment:
      LLAMA_MODEL_FILE: ${LLAMA_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}
      LLAMA_MODEL_URL: ${LLAMA_MODEL_URL:-https://huggingface.co/Qwen/Qwen2.5-3B-Instruct-GGUF/resolve/main/qwen2.5-3b-instruct-q4_k_m.gguf}
      # No colon: an explicitly empty LLAMA_MODEL_SHA256 skips verification.
      LLAMA_MODEL_SHA256: ${LLAMA_MODEL_SHA256-626b4a6678b86442240e33df819e00132d3ba7dddfe1cdc4fbb18e0a9615c62d}
      TTS_ENABLED: ${TTS_ENABLED:-false}
      TTS_VOICE_MODEL_PATH: ${TTS_VOICE_MODEL_PATH:-models/tts/en_US-libritts_r-medium.onnx}
    volumes:
      - models:/models

  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qconsensus-llama
    depends_on:
      models:
        condition: service_completed_successfully
    command:
      - "-m"
      - "/models/${LLAMA_MODEL_FILE:-Qwen2.5-3B-Instruct-Q4_K_M.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-ngl"
      - "0"
      - "-c"
      - "4096"
      - "--threads"
      - "4"
    ports:
      - "${LLM_PORT:-8080}:8080"
    volumes:
      - models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

  blockchain:
    build:
      context: ./blockchain
      dockerfile: geth.Dockerfile
    container_name: qconsensus-blockchain
    ports:
      - "${RPC_PORT:-8545}:8545"
    volumes:
      - gethdata:/data
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          wget -q -O- --header='Content-Type: application/json'
          --post-data='{"jsonrpc":"2.0","method":"eth_blockNumber","params":[],"id":1}'
          http://127.0.0.1:8545 | grep -q result
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  models:
  gethdata:
  anchor:
